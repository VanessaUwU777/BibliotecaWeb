<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - BibliotecaWeb</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f3f0;
            color: #333;
        }

        header {
            background-color: #3b2418;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .contenedor {
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #3b2418;
        }

        .descripcion {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .boton {
            display: block;
            margin: 25px auto 0;
            background-color: #a96f3d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .boton:hover {
            background-color: #8c572f;
        }

        footer {
            background-color: #3b2418;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">📚 BibliotecaWeb</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="libros.html">Libros</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<div class="contenedor">

    <h1>Contáctanos</h1>

    <p class="descripcion">
        ¿Tienes alguna duda o comentario? Escríbenos y estaremos encantados de ayudarte.
    </p>

    <form>

        <label>Nombre:</label>
        <input type="text" placeholder="Escribe tu nombre">

        <label>Correo electrónico:</label>
        <input type="email" placeholder="Escribe tu correo">

        <label>Mensaje:</label>
        <textarea placeholder="Escribe tu mensaje"></textarea>

        <button class="boton" type="submit">
            Enviar mensaje
        </button>

    </form>

</div>

<footer>
    © 2026 BibliotecaWeb | Sistema de Biblioteca
</footer>

</body>
</html>
